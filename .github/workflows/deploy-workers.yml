name: deploy workers

# The apex `lopecode` Worker deploys itself: it is connected to this repo through
# Workers Builds, so a push to main redeploys it with no CI token. The sibling
# Workers are separate Cloudflare Workers and are NOT covered by that connection
# — on 2026-08-30 a push carrying a feed fix redeployed apex and render but left
# lopecode-feed running the previous code for hours, silently. This workflow is
# what makes a sibling Worker deploy on push.
#
# If you later connect a sibling to Workers Builds in the dashboard, drop it from
# the matrix below — a double deploy is harmless (same artifact) but makes it hard
# to tell which pipeline actually shipped.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit on the account. Not the Global key.
#   CLOUDFLARE_ACCOUNT_ID  no wrangler.jsonc here declares account_id, so the
#                          token alone is ambiguous when the account has >1.

on:
  push:
    branches: [main]
    paths:
      - 'feed/**'
      - 'render/**'
      - 'contrail/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Which Worker to deploy'
        required: true
        type: choice
        options: [all, feed, render, contrail]
        default: all

# Never cancel in flight: a cancelled `wrangler deploy` can leave the Worker on a
# half-uploaded version, and the run reports a failure that already shipped.
concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  # Deploy only what changed, so an unrelated push does not redeploy every Worker.
  changed:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.pick.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.worker }}
        run: |
          set -euo pipefail
          all='["feed","render","contrail"]'
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$CHOICE" = all ]; then echo "workers=$all" >> "$GITHUB_OUTPUT"
            else echo "workers=[\"$CHOICE\"]" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          # The workflow file itself changing means "redeploy everything", so a fix
          # to this pipeline is provably exercised rather than merely committed.
          if git diff --name-only HEAD^ HEAD | grep -q '^\.github/workflows/deploy-workers\.yml$'; then
            echo "workers=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sel=$(git diff --name-only HEAD^ HEAD \
                | awk -F/ '$1=="feed"||$1=="render"||$1=="contrail"{print $1}' \
                | sort -u | jq -R . | jq -s -c .)
          [ "$sel" = '[]' ] && echo "nothing to deploy"
          echo "workers=$sel" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changed
    if: needs.changed.outputs.workers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one Worker failing must not strand the others
      matrix:
        worker: ${{ fromJSON(needs.changed.outputs.workers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install
        working-directory: ${{ matrix.worker }}
        run: npm ci || npm install

      # Gate the deploy on the Worker's own tests. render additionally needs its
      # bundled exporter built; its `deploy` script does that, but the test needs
      # it too, so build first and let the deploy step reuse the artifact.
      - name: Build (render only)
        if: matrix.worker == 'render'
        working-directory: render
        run: npm run build

      - name: Test
        working-directory: ${{ matrix.worker }}
        run: npm test --if-present

      - name: Typecheck
        working-directory: ${{ matrix.worker }}
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.worker }}
          command: deploy
